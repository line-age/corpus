# Local development only. Real deployments use the generic charts in line-age/deploy with
# environment values supplied from outside this org (L-0006, L-0009).
services:
  postgres:
    # ParadeDB = Postgres with the pg_search (BM25) extension. Pin a version tag before sharing.
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: corpus
      POSTGRES_PASSWORD: corpus
      POSTGRES_DB: corpus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus"]
      interval: 5s
      retries: 10

  minio:
    # Optional: the default raw store is a local directory (CORPUS_RAW_STORE=file://...).
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [rawdata:/data]

  ingest:
    profiles: ["run"]
    build: { context: ., dockerfile: Dockerfile.ingest }
    env_file: [.env]
    environment:
      CORPUS_DATABASE_URL: postgresql+psycopg://corpus:corpus@postgres:5432/corpus
      CORPUS_RAW_STORE: file:///raw
    volumes: [rawdata:/raw]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata: {}
  rawdata: {}
