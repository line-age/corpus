name: corpus

services:
  corpus-api:
    build:
      context: .
      target: dev
    image: corpus-api:dev
    env_file: .env
    ports:
      - "${FORWARD_API_PORT:-9001}:${API_PORT:-9001}"
    volumes:
      # Live code; the virtualenv lives at /opt/venv, outside the mount.
      - .:/app
    depends_on:
      corpus-ingest-db:
        condition: service_healthy
    networks:
      - lineage
    restart: unless-stopped

  # The one database: ingest writes to it and the API searches it. ParadeDB adds pg_search,
  # whose BM25 index ranks search results. Search uses pg_search's `###` operator and
  # pdb.score(), so keep the version pinned. Reads POSTGRES_USER, POSTGRES_PASSWORD and
  # POSTGRES_DB, the same values the API uses.
  corpus-ingest-db:
    image: paradedb/paradedb:0.27.0-pg18
    env_file: .env
    ports:
      - "${FORWARD_INGEST_DB_PORT:-5433}:5432"
    volumes:
      # The parent of PGDATA, so it works on Postgres 18 and earlier.
      - corpus-ingest-db-data:/var/lib/postgresql
    healthcheck:
      # Check over TCP, as the API connects. On a fresh volume the entrypoint's temporary
      # init server listens only on the Unix socket, so a socket check can pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lineage
    restart: unless-stopped

  corpus-ingest:
    profiles: ["ingest"]
    build:
      context: .
      target: ingest
    image: corpus-ingest:dev
    env_file: .env
    environment:
      CORPUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-corpus}:${POSTGRES_PASSWORD:-corpus}@corpus-ingest-db:5432/${POSTGRES_DB:-corpus}
      CORPUS_RAW_STORE: file:///raw
    volumes:
      - corpus-raw-data:/raw
    depends_on:
      corpus-ingest-db:
        condition: service_healthy
    networks:
      - lineage

  corpus-minio:
    profiles: ["s3"]
    image: minio/minio:latest # pin a release tag before sharing
    command: server /data --console-address :9101
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - corpus-minio-data:/data
    networks:
      - lineage

volumes:
  corpus-ingest-db-data:
  corpus-raw-data:
  corpus-minio-data:

networks:
  lineage:
    name: lineage
    driver: bridge
