name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: corpus
          POSTGRES_PASSWORD: corpus
          POSTGRES_DB: corpus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corpus" --health-interval 5s --health-retries 10
    env:
      CORPUS_TEST_DATABASE_URL: postgresql+psycopg://corpus:corpus@localhost:5432/corpus_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest -q -rs

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.ingest -t corpus-ingest:ci .
      - run: docker run --rm corpus-ingest:ci --help
