[project]
name = "corpus-core"
version = "0.1.0"
description = "corpus index format: schema, lanes, parsing, Internet Archive access"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_core"]
