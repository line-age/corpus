[project]
name = "corpus-ingest"
version = "0.1.0"
description = "corpus ingest: resumable stages from Internet Archive to a BM25 index"
requires-python = ">=3.12"
dependencies = ["corpus-core", "typer>=0.13", "structlog>=24.4"]

[project.scripts]
corpus-ingest = "corpus_ingest.cli:app"

[tool.uv.sources]
corpus-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_ingest"]
