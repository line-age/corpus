# Generic defaults only. Hostnames, sizes, storage classes, schedules and credentials belong
# to whoever deploys the chart, not to this repository.

# The api and ingest images are built from the same commit, so they share one tag.
image:
  tag: ""          # required, e.g. sha-0123abc
  pullPolicy: IfNotPresent
  api:
    repository: ghcr.io/line-age/corpus-api
  ingest:
    repository: ghcr.io/line-age/corpus-ingest
imagePullSecrets: []

api:
  replicas: 1
  # Extra environment, as name: value. See .env.example for what the API reads
  # (DOCS_ENABLED, LOG_LEVEL, HEALTHZ_TIMEOUT_SECONDS, POSTGRES_POOL_SIZE, ...).
  # POSTGRES_HOST, _PORT, _USER, _PASSWORD and _DB come from the database secret.
  env: {}
  # Secrets whose keys become environment variables.
  envFromSecrets: []
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# `alembic upgrade head` on both databases, as an init container of the API pod, so the API
# never starts on an old schema. A failed migration keeps the pod in Init and is retried.
migrations:
  enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

ingest:
  # Extra environment for every ingest job, as name: value: CORPUS_CONCURRENCY,
  # CORPUS_USER_AGENT, CORPUS_S3_ENDPOINT_URL, ... CORPUS_DATABASE_URL and
  # CORPUS_RAW_STORE are set by the chart.
  env: {}
  # Secrets whose keys become environment variables, e.g. AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY for an s3:// raw store.
  envFromSecrets: []
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
  # Where raw files go. Empty: file:///raw on the volume below. s3://bucket[/prefix] for
  # object storage, in which case set rawStorage.enabled false.
  rawStore: ""
  # One CronJob per entry, running `corpus-ingest <args>`. A suspended job never fires on its
  # own; run it with `kubectl create job --from=cronjob/<release>-ingest-<name> <job name>`.
  # Every stage is resumable, so a run that stops can simply be run again.
  #   jobs:
  #     run:
  #       schedule: "0 3 * * *"
  #       suspend: true
  #       args: [run, -c, some-collection, --limit, "15"]
  jobs: {}

# file:///raw for ingest, when ingest.rawStore is empty.
rawStorage:
  enabled: true
  existingClaim: ""
  storageClass: ""
  size: 20Gi
  # Jobs may overlap and may run on any node.
  accessMode: ReadWriteMany

database:
  # The API's database: pgvector. Each is a one-instance CloudNativePG cluster in the
  # release's namespace (needs the CNPG operator), or, with existingSecret set, an external
  # database whose secret has the keys a CNPG app secret has: host, port, dbname, username,
  # password and uri.
  api:
    existingSecret: ""
    cnpg:
      instances: 1
      # The standard image carries pgvector; the operator's default does not.
      imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
      size: 5Gi
      storageClass: ""
  # Ingest's database: ParadeDB, for pg_search's BM25 index (and pgvector).
  ingest:
    existingSecret: ""
    cnpg:
      instances: 1
      imageName: docker.io/paradedb/paradedb:18-v0.26.8
      size: 20Gi
      storageClass: ""
  # CNPG serves TLS; require it. Passed to libpq as PGSSLMODE.
  sslmode: require

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
