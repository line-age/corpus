[project]
name = "corpus"
version = "0.1.0"
description = "Lineage trade-press ingest and authority-ranked RAG search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.162",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=9.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
