[project]
name = "corpus"
version = "0.1.0"
description = "Lineage trade-press ingest and authority-ranked RAG search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "corpus-core",
    "fastapi>=0.162",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "pytest>=9.2",
    "corpus-ingest",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.9",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
corpus-core = { workspace = true }
corpus-ingest = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a Postgres database (set CORPUS_TEST_DATABASE_URL)"]
